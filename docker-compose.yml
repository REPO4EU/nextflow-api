services:
  nextflow-api:
    image: nextflow-api
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${DATA_DIR}:${DATA_DIR}
      - ${PIPELINE_DIR}:${PIPELINE_DIR}
    environment:
      PIPELINE_PATH: "${PIPELINE_DIR}/main.nf"
      RUN_DIR: ${DATA_DIR}/runs
      DB_PATH: ${DATA_DIR}/runs.db
      NEXTFLOW_BIN: nextflow
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
      NEXTFLOW_LOCAL_CPUS: ${NEXTFLOW_LOCAL_CPUS:-5}
      NEXTFLOW_PROCESS_SINGLE_CPUS: ${NEXTFLOW_PROCESS_SINGLE_CPUS:-1}
      NEXTFLOW_PROCESS_LOW_CPUS: ${NEXTFLOW_PROCESS_LOW_CPUS:-2}
      NEXTFLOW_PROCESS_MEDIUM_CPUS: ${NEXTFLOW_PROCESS_MEDIUM_CPUS:-3}
      NEXTFLOW_PROCESS_HIGH_CPUS: ${NEXTFLOW_PROCESS_HIGH_CPUS:-5}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENABLED: ${AUTH_ENABLED}
      CONSUL_ENABLED: false
      CONSUL_BASE_URL: http://consul:8500
      CONSUL_TOKEN: ${CONSUL_TOKEN}
      CONSUL_SERVICE_ID: NextflowApi.${CI_ENVIRONMENT_NAME}
      CONSUL_SERVICE_NAME: NextflowApi
      CONSUL_SERVICE_API_URL: nextflow-api
      CONSUL_SERVICE_API_PORT: 8000
    restart: unless-stopped
